<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Biodata Siswa</title>
    <!-- Import Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tom Select untuk Dropdown Search -->
    <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .font-heading {
            font-family: 'Bricolage Grotesque', sans-serif;
        }
        .form-container {
            max-width: 500px;
            width: 100%;
            margin: 2rem auto;
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }
        .header-section {
            padding: 2.5rem 1.5rem;
            text-align: center;
            background-color: #2563eb;
            color: white;
        }
        .form-title {
            font-family: 'Bricolage Grotesque', sans-serif;
            font-size: 2.25rem;
            font-weight: 800;
            line-height: 1.1;
            text-transform: uppercase;
            letter-spacing: -0.02em;
        }
        .form-description {
            font-size: 0.95rem;
            opacity: 0.9;
            margin-top: 0.75rem;
            line-height: 1.4;
            font-weight: 500;
        }
        .label-biru {
            color: #2563eb;
            font-family: 'Bricolage Grotesque', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
            display: block;
        }
        .ts-control {
            border-radius: 0.5rem !important;
            padding: 0.75rem 1rem !important;
            border: 1px solid #d1d5db !important;
            font-size: 1rem !important;
        }
        .ts-control:focus-within {
            border-color: #2563eb !important;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1) !important;
        }
        .loader {
            border: 2px solid #f3f3f3;
            border-radius: 50%;
            border-top: 2px solid #ffffff;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
        
        /* Gaya untuk pesan error duplikat */
        .duplicate-warning {
            color: #dc2626;
            font-size: 0.75rem;
            font-weight: 600;
            margin-top: 0.5rem;
            display: flex;
            items-center: center;
        }
    </style>
</head>
<body class="p-4">

    <div class="form-container">
        <div class="header-section">
            <h2 class="form-title">FORM BIODATA</h2>
            <p class="form-description">
                Silakan lengkapi formulir di bawah ini
            </p>
        </div>

        <!-- Status Message (Success/Error General) -->
        <div id="statusMessage" class="hidden m-4 p-4 rounded-lg text-center font-bold"></div>

        <form id="googleSheetForm" class="p-6 space-y-6">
            
            <!-- Nama Lengkap -->
            <div>
                <label class="label-biru">Nama Lengkap</label>
                <select id="employeeName" name="nama" placeholder="Cari nama Anda..." required>
                    <option value="">Memuat data...</option>
                </select>
                <!-- Pesan Peringatan Duplikat -->
                <div id="duplicateError" class="duplicate-warning hidden">
                    ⚠️ Nama ini sudah pernah mengisi biodata.
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <!-- Kelas -->
                <div>
                    <label class="label-biru">Kelas</label>
                    <select id="classSelect" name="kelas" required
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all">
                        <option value="">Pilih Kelas</option>
                    </select>
                </div>

                <!-- NIS -->
                <div>
                    <label class="label-biru">NIS</label>
                    <input type="text" name="nis" id="nisInput" required placeholder="12345"
                        class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
            </div>

            <!-- NISN -->
            <div>
                <label class="label-biru">NISN</label>
                <input type="text" name="nisn" id="nisnInput" required placeholder="0012345678"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                <div class="mt-2 flex items-center">
                    <span class="text-[11px] text-gray-500 mr-2">Lupa NISN?</span>
                    <a href="https://nisn.data.kemdikbud.go.id/index.php/Cindex/formcaribynama" target="_blank" 
                       class="text-[11px] text-blue-600 font-bold hover:underline flex items-center">
                        Klik disini
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3 ml-0.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                        </svg>
                    </a>
                </div>
            </div>

            <!-- No HP -->
            <div>
                <label class="label-biru">No HP (WhatsApp)</label>
                <input type="tel" name="no_hp" id="phoneInput" required placeholder="08xxxx"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>

            <!-- Asal Sekolah -->
            <div>
                <label class="label-biru">Asal Sekolah</label>
                <select id="schoolSelect" name="asal_sekolah" placeholder="Cari/Ketik sekolah..." required>
                    <option value="">Memuat data...</option>
                </select>
            </div>

            <!-- Alamat -->
            <div>
                <label class="label-biru">Alamat (Domisili)</label>
                <textarea name="alamat" id="addressInput" required placeholder="RT/RW, Desa, Kecamatan" rows="3"
                    class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none resize-none"></textarea>
            </div>

            <!-- Submit Button -->
            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg shadow-lg shadow-blue-200 transition-all active:scale-95 flex items-center justify-center uppercase tracking-widest disabled:bg-gray-400 disabled:shadow-none disabled:cursor-not-allowed">
                <span id="btnText">Kirim Biodata</span>
            </button>
        </form>

        <div class="bg-gray-50 p-4 text-center border-t border-gray-100">
            <p class="text-[10px] text-gray-400 font-bold tracking-widest uppercase italic">SMP Negeri 4 Majenang</p>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzmsAPkW70WWuMynnQ9Ok4EsS0W4sAhFYUGhDHh_xepZgPPpzmPspWIHT_f5-mG_jvcYA/exec";

        const form = document.getElementById('googleSheetForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const statusDiv = document.getElementById('statusMessage');
        const duplicateError = document.getElementById('duplicateError');
        const phoneInput = document.getElementById('phoneInput');
        const nisInput = document.getElementById('nisInput');
        const nisnInput = document.getElementById('nisnInput');
        
        let nameSelectControl, schoolSelectControl;
        let existingNames = []; // Menyimpan data nama yang sudah ada

        // Validasi input angka
        [phoneInput, nisInput, nisnInput].forEach(input => {
            input.addEventListener('input', function() {
                this.value = this.value.replace(/[^0-9]/g, ''); 
            });
        });

        async function initData() {
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                
                // Simpan daftar nama yang sudah ada di database untuk validasi client-side
                if (data.sudah_mengisi) {
                    existingNames = data.sudah_mengisi;
                }

                populateSelect('employeeName', data.nama, "Cari Nama Anda...", true, false);
                populateSelect('classSelect', data.kelas, "Pilih Kelas", false, false);
                populateSelect('schoolSelect', data.asal_sekolah, "Pilih/Ketik Sekolah...", true, true);
            } catch (error) {
                console.error('Error fetching data:', error);
            }
        }

        function populateSelect(id, items, placeholder, useSearch, canCreate) {
            const select = document.getElementById(id);
            select.innerHTML = `<option value="">${placeholder}</option>`;
            if (items) {
                items.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item;
                    opt.textContent = item;
                    select.appendChild(opt);
                });
            }
            if (useSearch) {
                const control = new TomSelect(`#${id}`, {
                    create: canCreate,
                    sortField: { field: "text", order: "asc" },
                    placeholder: placeholder,
                    onChange: function(value) {
                        if (id === 'employeeName') {
                            checkDuplicate(value);
                        }
                    }
                });
                if (id === 'employeeName') nameSelectControl = control;
                if (id === 'schoolSelect') schoolSelectControl = control;
            }
        }

        // Fungsi Validasi Duplikat
        function checkDuplicate(name) {
            if (!name) {
                duplicateError.classList.add('hidden');
                submitBtn.disabled = false;
                return;
            }

            // Cek apakah nama ada di daftar existingNames
            const isDuplicate = existingNames.includes(name);

            if (isDuplicate) {
                duplicateError.classList.remove('hidden');
                submitBtn.disabled = true;
            } else {
                duplicateError.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Re-check sebelum kirim
            const selectedName = nameSelectControl.getValue();
            if (existingNames.includes(selectedName)) {
                showStatus('⚠️ Nama ini sudah terdaftar!', 'bg-red-100 text-red-700 border-red-200 border');
                return;
            }

            submitBtn.disabled = true;
            btnText.innerHTML = '<span class="loader"></span> Mengirim...';

            const formData = new FormData(form);
            const params = new URLSearchParams(formData);

            try {
                // Mengirim data
                await fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: params });
                
                showStatus('✅ Data Berhasil Terkirim!', 'bg-green-100 text-green-700 border-green-200 border');
                
                // Tambahkan nama yang baru dikirim ke list existingNames agar tidak bisa kirim ulang tanpa refresh
                existingNames.push(selectedName);
                
                form.reset();
                if(nameSelectControl) nameSelectControl.clear();
                if(schoolSelectControl) schoolSelectControl.clear();
            } catch (error) {
                showStatus('❌ Terjadi Kesalahan!', 'bg-red-100 text-red-700 border-red-200 border');
            } finally {
                submitBtn.disabled = false;
                btnText.innerText = 'Kirim Biodata';
            }
        });

        function showStatus(msg, classes) {
            statusDiv.innerText = msg;
            statusDiv.className = `m-4 p-4 rounded-lg text-center font-bold ${classes}`;
            statusDiv.classList.remove('hidden');
            setTimeout(() => statusDiv.classList.add('hidden'), 5000);
        }

        initData();
    </script>
</body>
</html>
